<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #FFF3D5; /* Main page background */
            min-height: 100vh;
            color: #29251f;
        }

        /* Top navigation bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 50px;
            background-color: #F2E0B6; /* Slightly darker horizontal bar */
            border-bottom: 1px solid #E3CE9E;
        }

        .logo img {
            height: 75px;
            width: auto;
            display: block;
            mix-blend-mode: multiply;
        }

        /* Scan button */
        .scan-button {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #29251f;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .scan-button:hover {
            background-color: #443b30;
            transform: translateY(-2px);
        }

        .document-icon {
            width: 18px;
            height: 22px;
            border: 2px solid white;
            border-radius: 2px;
            position: relative;
        }

        .document-icon::before {
            content: "";
            position: absolute;
            top: 5px;
            left: 3px;
            width: 10px;
            height: 2px;
            background: white;
            box-shadow: 0 4px white, 0 8px white;
        }

        /* Main content */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: calc(100vh - 150px);
            padding: 30px;
        }

        .main-text {
            max-width: 650px;
            font-size: 20px;
            line-height: 1.9;
            color: #443b30;
        }

        /* Bottom contact bar */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: white;
            text-align: center;
            padding: 14px;
            font-size: 12px;
            color: #555;
            z-index: 10;
        }

        footer a {
            color: #29251f;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Dark background overlay when popup is open */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
            z-index: 99;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Grey Bottom Pop-up */
        .bottom-popup {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            background-color: #3a3a3a;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 30px 25px 40px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
            transition: bottom 0.3s ease-out;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bottom-popup.active {
            bottom: 0;
        }

        /* Small drag handle bar at top of popup */
        .popup-handle {
            width: 40px;
            height: 4px;
            background-color: #777;
            border-radius: 2px;
            margin-bottom: 25px;
        }

        /* Container for the 2 boxes */
        .popup-boxes {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        /* Camera & Photos boxes */
        .option-box {
            flex: 1;
            background-color: #525252;
            color: white;
            border: 2px solid #666;
            border-radius: 14px;
            padding: 25px 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .option-box:hover {
            background-color: #636363;
            transform: translateY(-3px);
        }

        .option-box span.icon {
            font-size: 28px;
        }

        /* Hide default file inputs */
        input[type="file"] {
            display: none;
        }

        /* Mobile layout */
        @media (max-width: 600px) {
            header {
                padding: 15px 20px;
            }

            .logo img {
                height: 60px;
            }

            .main-text {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <img src="logo.png" alt="Website Logo">
        </div>

        <button class="scan-button" id="openScanBtn">
            <span class="document-icon"></span>
            Scan
        </button>
    </header>

    <main>
        <p class="main-text">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit.<br>
            Sed do eiusmod tempor incididunt ut labore et dolore.<br>
            Magna aliqua ut enim ad minim veniam, quis nostrud.<br>
            Exercitation ullamco laboris nisi ut aliquip ex ea.<br>
            Commodo consequat duis aute irure dolor in reprehenderit.
        </p>
    </main>

    <footer>
        <a href="mailto:contact@example.com">Contact us</a>
    </footer>

    <!-- Dark overlay to close popup when tapping outside -->
    <div class="overlay" id="overlay"></div>

    <!-- Bottom Pop-up Menu -->
    <div class="bottom-popup" id="bottomPopup">
        <div class="popup-handle"></div>
        <div class="popup-boxes">
            <!-- Camera Box -->
            <label for="cameraInput" class="option-box">
                <span class="icon">📷</span>
                Camera
            </label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment">

            <!-- Photos Box -->
            <label for="photosInput" class="option-box">
                <span class="icon">🖼️</span>
                Photos
            </label>
            <input type="file" id="photosInput" accept="image/*">
        </div>
    </div>

    <script>
        const openScanBtn = document.getElementById('openScanBtn');
        const bottomPopup = document.getElementById('bottomPopup');
        const overlay = document.getElementById('overlay');

        // Open the popup
        openScanBtn.addEventListener('click', () => {
            bottomPopup.classList.add('active');
            overlay.classList.add('active');
        });

        // Close the popup when clicking outside
        overlay.addEventListener('click', () => {
            bottomPopup.classList.remove('active');
            overlay.classList.remove('active');
        });
    </script>

</body>
</html>
